<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Admin gradient -->
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Log window -->
  <rect x="3" y="4" width="18" height="14" rx="2"
        fill="url(#adminGrad)" stroke="#1e293b" stroke-width="1"/>

  <!-- Terminal prompt -->
  <path d="M6 8l2 2-2 2" fill="none"
        stroke="#cbd5f5" stroke-width="1.25"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Log lines -->
  <line x1="10" y1="10" x2="16" y2="10"
        stroke="#e2e8f0" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="6" y1="13" x2="15" y2="13"
        stroke="#e2e8f0" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="6" y1="15.5" x2="13" y2="15.5"
        stroke="#e2e8f0" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Timestamp badge -->
  <circle cx="17.5" cy="6.5" r="3"
          fill="#22c55e" stroke="#166534" stroke-width="0.75"/>

  <!-- Clock hands -->
  <path d="M17.5 5.5v1.5l1 0.75"
        fill="none" stroke="white"
        stroke-width="0.75"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>