<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Blueprint gradient -->
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Blueprint paper -->
  <rect x="4" y="3" width="14" height="18" rx="2"
        fill="url(#blueprintGrad)" stroke="#1e3a8a" stroke-width="1"/>

  <!-- Blueprint grid lines -->
  <line x1="7" y1="7" x2="15" y2="7" stroke="#bfdbfe" stroke-width="0.75"/>
  <line x1="7" y1="10" x2="15" y2="10" stroke="#bfdbfe" stroke-width="0.75"/>
  <line x1="7" y1="13" x2="12" y2="13" stroke="#bfdbfe" stroke-width="0.75"/>

  <!-- Community nodes -->
  <circle cx="8" cy="16" r="1" fill="#fde68a" stroke="#92400e" stroke-width="0.5"/>
  <circle cx="12" cy="17.5" r="1" fill="#fde68a" stroke="#92400e" stroke-width="0.5"/>
  <circle cx="15" cy="15.5" r="1" fill="#fde68a" stroke="#92400e" stroke-width="0.5"/>

  <!-- Connections -->
  <path d="M8 16l4 1.5 3-2" fill="none" stroke="#92400e" stroke-width="0.5"/>

  <!-- Regenerative leaf -->
  <path d="M17 6c2 0 4 2 3 4-2 0-4-2-3-4z"
        fill="url(#leafGrad)" stroke="#166534" stroke-width="0.75"/>
  <path d="M17 6c-1.5 3-1.5 5-1.5 8"
        fill="none" stroke="#166534" stroke-width="0.75" stroke-linecap="round"/>
</svg>