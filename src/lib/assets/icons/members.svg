<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Members Admin gradient -->
    <linearGradient id="membersAdminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main panel -->
  <rect x="3" y="4" width="18" height="14" rx="2"
        fill="url(#membersAdminGrad)" stroke="#4338ca" stroke-width="1"/>

  <!-- Main member -->
  <circle cx="10" cy="9" r="2.2"
          fill="#fef3c7" stroke="#92400e" stroke-width="0.75"/>

  <!-- Secondary member -->
  <circle cx="14.5" cy="10" r="1.6"
          fill="#e0e7ff" stroke="#3730a3" stroke-width="0.5"/>

  <!-- Shoulders -->
  <path d="M6.5 14c1.5-2 7-2 8.5 0"
        fill="none" stroke="#e0e7ff"
        stroke-width="0.75"
        stroke-linecap="round"/>

  <!-- Admin key badge -->
  <circle cx="18" cy="6" r="3"
          fill="#facc15" stroke="#92400e" stroke-width="0.75"/>

  <!-- Key -->
  <path d="M17.2 6a0.8 0.8 0 1 1 1.6 0 0.8 0.8 0 0 1-1.6 0z"
        fill="#92400e"/>
  <path d="M18 6.8v1.2h0.8v0.6H18"
        stroke="#92400e"
        stroke-width="0.75"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>