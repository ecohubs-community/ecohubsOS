<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="welcomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Screen / video frame -->
  <rect x="2.5" y="4.5" width="19" height="13" rx="2.5"
        fill="url(#welcomeGrad)" stroke="#0f766e" stroke-width="1" />

  <!-- Play triangle -->
  <path d="M10 9.2 L15 12 L10 14.8 Z"
        fill="#ecfdf5" stroke="#ecfdf5" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Stand -->
  <line x1="9" y1="20" x2="15" y2="20" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="17.5" x2="12" y2="20" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" />
</svg>
